<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Illustration: excerpt of a generated ARCHITECTURE.md</title>
  <desc id="desc">Section 2 of a generated ARCHITECTURE.md for a differential-drive robot in simulation: teleop and Nav2 commands pass through a proposed twist_mux to the diff_drive_controller and Gazebo, with joint states, scan and clock feeding state estimation, and TF and odometry returning to Nav2. Below, a ROS graph contract table lists endpoint, type, QoS, units and frame, owner and evidence for four topics.</desc>
