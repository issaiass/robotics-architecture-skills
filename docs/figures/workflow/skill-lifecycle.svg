<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">How an AI tool uses a skill</title>
  <desc id="desc">Six steps: install the folder, the tool discovers name and description, the skill activates automatically or by name, the agent executes the workflow on the repository, delivers ARCHITECTURE.md, README.md or audit findings, and reviews the result, iterating back to execution when gaps remain.</desc>
  <style>
    .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'SFMono-Regular',Menlo,'DejaVu Sans Mono',monospace}
    .h1{font-size:26px;font-weight:700;fill:#1f2328}
    .sub{font-size:15px;fill:#59636e}
    .ct{font-size:19px;font-weight:700;fill:#1f2328}
    .cd{font-size:14px;fill:#424a53}
    .n{font-size:15px;font-weight:700;fill:#ffffff}
    .chip{font-size:12px;fill:#1f2328}
    .lbl{font-size:13px;fill:#59636e;font-style:italic}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="619" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="58" class="sans h1">How an AI tool uses a skill</text>
  <text x="40" y="86" class="sans sub">Same lifecycle in Claude Code, Codex, Cursor, Windsurf, Grok Build, Copilot and Gemini CLI; only the folder and the invoke syntax change.</text>

  <!-- Row 1 -->
  <g>
    <rect x="40" y="112" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="74" cy="148" r="16" fill="#1757ac"/><text x="74" y="153" text-anchor="middle" class="sans n">1</text>
    <text x="102" y="155" class="sans ct">Install</text>
    <text x="64" y="190" class="sans cd">Copy a skill folder into the tool's skills</text>
    <text x="64" y="210" class="sans cd">directory, at project or user scope.</text>
    <rect x="64" y="240" width="124" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="126" y="257" text-anchor="middle" class="mono chip">.agents/skills/</text>
    <rect x="196" y="240" width="124" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="258" y="257" text-anchor="middle" class="mono chip">.claude/skills/</text>
  </g>
  <g>
    <rect x="430" y="112" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="464" cy="148" r="16" fill="#1757ac"/><text x="464" y="153" text-anchor="middle" class="sans n">2</text>
    <text x="492" y="155" class="sans ct">Discover</text>
    <text x="454" y="190" class="sans cd">At start-up the tool reads only each skill's</text>
    <text x="454" y="210" class="sans cd">frontmatter: its name and description.</text>
    <rect x="454" y="240" width="64" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="486" y="257" text-anchor="middle" class="mono chip">name</text>
    <rect x="526" y="240" width="104" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="578" y="257" text-anchor="middle" class="mono chip">description</text>
  </g>
  <g>
    <rect x="820" y="112" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="854" cy="148" r="16" fill="#1757ac"/><text x="854" y="153" text-anchor="middle" class="sans n">3</text>
    <text x="882" y="155" class="sans ct">Activate</text>
    <text x="844" y="190" class="sans cd">Automatic when your request matches the</text>
    <text x="844" y="210" class="sans cd">description, or explicit by the skill's name.</text>
    <rect x="844" y="240" width="92" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="890" y="257" text-anchor="middle" class="mono chip">/skill-name</text>
    <rect x="942" y="240" width="92" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="988" y="257" text-anchor="middle" class="mono chip">$skill-name</text>
    <rect x="1040" y="240" width="92" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="1086" y="257" text-anchor="middle" class="mono chip">@skill-name</text>
  </g>

  <!-- Row 2 (right to left) -->
  <g>
    <rect x="820" y="352" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="854" cy="388" r="16" fill="#1757ac"/><text x="854" y="393" text-anchor="middle" class="sans n">4</text>
    <text x="882" y="395" class="sans ct">Execute</text>
    <text x="844" y="428" class="sans cd">The agent runs the Workflow on your checkout:</text>
    <text x="844" y="448" class="sans cd">reads manifests, launch and Compose files,</text>
    <text x="844" y="468" class="sans cd">and traces command and feedback paths.</text>
    <rect x="844" y="484" width="134" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="911" y="501" text-anchor="middle" class="mono chip">read-only checks</text>
    <rect x="986" y="484" width="110" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="1041" y="501" text-anchor="middle" class="mono chip">isolated sim</text>
  </g>
  <g>
    <rect x="430" y="352" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="464" cy="388" r="16" fill="#1757ac"/><text x="464" y="393" text-anchor="middle" class="sans n">5</text>
    <text x="492" y="395" class="sans ct">Deliver</text>
    <text x="454" y="428" class="sans cd">Writes ARCHITECTURE.md (Sections 1–11),</text>
    <text x="454" y="448" class="sans cd">README.md (Section 8) or audit findings</text>
    <text x="454" y="468" class="sans cd">with file locations and verification steps.</text>
    <rect x="454" y="484" width="128" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="518" y="501" text-anchor="middle" class="mono chip">ARCHITECTURE.md</text>
    <rect x="590" y="484" width="88" height="26" rx="6" fill="#eef1f4" stroke="#d0d7de"/><text x="634" y="501" text-anchor="middle" class="mono chip">README.md</text>
  </g>
  <g>
    <rect x="40" y="352" width="340" height="170" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="74" cy="388" r="16" fill="#1757ac"/><text x="74" y="393" text-anchor="middle" class="sans n">6</text>
    <text x="102" y="395" class="sans ct">Review</text>
    <text x="64" y="428" class="sans cd">Checks paths, commands and links against</text>
    <text x="64" y="448" class="sans cd">the checkout and lists what still needs a</text>
    <text x="64" y="468" class="sans cd">simulator, bench rig or the real robot.</text>
    <rect x="64" y="484" width="80" height="26" rx="6" fill="#cce3fd"/><text x="104" y="501" text-anchor="middle" class="mono chip">verified</text>
    <rect x="152" y="484" width="96" height="26" rx="6" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/><text x="200" y="501" text-anchor="middle" class="mono chip">unverified</text>
  </g>

  <!-- Arrows -->
  <line x1="384" y1="197" x2="424" y2="197" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="774" y1="197" x2="814" y2="197" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="990" y1="286" x2="990" y2="346" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="816" y1="437" x2="776" y2="437" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="426" y1="437" x2="386" y2="437" stroke="#57606a" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Iterate loop -->
  <path d="M210,526 V566 H990 V530" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <rect x="380" y="553" width="440" height="26" fill="#f6f8fa"/>
  <text x="600" y="571" text-anchor="middle" class="sans lbl">iterate: close the gaps the review found, then run the workflow again</text>
</svg>
